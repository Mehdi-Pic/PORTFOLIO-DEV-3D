<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chambre 98 | CV interactif</title>
  <meta name="description" content="CV interactif en pixel art : une chambre d'ado, un vieux PC et un OS rétro.">
  <meta name="author" content="Mehdi PICHARD">
  <meta name="theme-color" content="#0b0a1a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='1' y='1' width='14' height='11' fill='%23e8e0c8'/%3E%3Crect x='3' y='3' width='10' height='7' fill='%233a7bd5'/%3E%3Crect x='3' y='8' width='10' height='2' fill='%234caf50'/%3E%3Crect x='5' y='12' width='6' height='2' fill='%23c8bfa5'/%3E%3Crect x='3' y='14' width='10' height='1' fill='%23c8bfa5'/%3E%3C/svg%3E">
  <!-- aperçu du lien partagé (LinkedIn, Discord, messageries…) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Chambre 98 | CV interactif de Mehdi PICHARD">
  <meta property="og:description" content="Une chambre en pixel art, un vieux PC, un OS rétro… et mon CV caché à l'intérieur.">
  <meta property="og:url" content="https://mehdi-pic.github.io/PORTFOLIO-DEV-3D/">
  <meta property="og:image" content="https://mehdi-pic.github.io/PORTFOLIO-DEV-3D/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=0f4b66c8">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "./js/city.js": "./js/city.js?v=0e3ec01c",
        "./js/cv-data.js": "./js/cv-data.js?v=6d596c4c",
        "./js/icons.js": "./js/icons.js?v=0530d370",
        "./js/os.js": "./js/os.js?v=bdd3345a",
        "./js/pixelart.js": "./js/pixelart.js?v=03b0b416",
        "./js/sound.js": "./js/sound.js?v=c666a86b",
        "./js/textures.js": "./js/textures.js?v=7d20397d"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="scene-still" hidden></canvas>
  <div id="vignette"></div>

  <div id="loader">
    <div class="ld-title">CHARGEMENT…</div>
    <div class="ld-bar"><div class="ld-fill"></div></div>
    <div class="ld-pct">0%</div>
  </div>

  <div id="intro" hidden>
    <div class="intro-card">
      <div class="intro-exe">CHAMBRE_98.EXE</div>
      <h1 id="intro-name"></h1>
      <p id="intro-title" class="intro-sub"></p>
      <p id="intro-action" class="intro-action"></p>
      <div class="intro-btns">
        <button id="btn-start" class="pbtn"></button>
      </div>
      <p class="intro-hint">Astuce : le diplôme, l'étagère et l'imprimante aussi sont cliquables 😉</p>
    </div>
  </div>

  <button id="quest" hidden aria-label="Cliquez ici pour utiliser le PC">
    <span class="quest-bob">
      <span class="quest-label">Cliquez ici</span>
      <span class="quest-arrow"></span>
    </span>
  </button>

  <button id="quest-print" class="quest" hidden aria-label="Imprimer mon CV (téléchargement)">
    <span class="quest-bob">
      <span class="quest-label">Imprimer mon CV</span>
      <span class="quest-arrow"></span>
    </span>
  </button>

  <div id="tip" hidden></div>

  <button id="btn-back" class="pbtn" hidden>◀ Retour</button>
  <div id="closeup-title" hidden></div>

  <div id="screen-overlay" hidden>
    <div id="os"></div>
    <div class="crt-fx"></div>
  </div>

  <button id="btn-mute" class="pbtn small">SON : ON</button>

  <noscript>Ce CV interactif nécessite JavaScript.</noscript>
  <script type="module" src="js/main.js?v=17dac0c0"></script>
</body>
</html>
